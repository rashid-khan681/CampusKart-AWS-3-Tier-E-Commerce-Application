apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: campuskart
  labels: {app: backend, tier: backend, app.kubernetes.io/part-of: campuskart}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend, tier: backend}
    spec:
      containers:
        - name: backend
          image: campuskart-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: {name: campuskart-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: campuskart-secrets, key: DB_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: campuskart-secrets, key: JWT_SECRET}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: campuskart
spec:
  selector: {app: backend}
  ports:
    - {port: 3000, targetPort: 3000}