apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: campuskart
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: campuskart
  labels: {app: mysql, tier: data, app.kubernetes.io/part-of: campuskart}
spec:
  replicas: 1
  strategy:
    type: Recreate   #RWO volume: the old pod must stop before the new one starts
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql, tier: data}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: campuskart-secrets, key: MYSQL_ROOT_PASSWORD}
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: {name: campuskart-config, key: DB_NAME}
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef: {name: campuskart-config, key: DB_USER}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: campuskart-secrets, key: DB_PASSWORD}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
        - name: init
          configMap: {name: mysql-init}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql # DB_HOST in the ConfigMap points to this name
  namespace: campuskart
spec:
  selector: {app: mysql}
  ports:
    - {port: 3306, targetPort: 3306}